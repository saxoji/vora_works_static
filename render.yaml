services:
  - type: web
    name: HorizonAI-Vora-Works
    runtime: static
    repo: https://github.com/saxoji/vora_works_static
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://horizonai-vora-works.onrender.com
      - key: PUBLIC_WORD_WEB_URL
        value: https://vword.vora.im
      - key: PUBLIC_SLIDE_WEB_URL
        value: https://vslide.vora.im
      - key: PUBLIC_CELL_WEB_URL
        value: https://vcell.vora.im
      - key: PUBLIC_HWP_WEB_URL
        value: https://vhwp.vora.im
      - key: PUBLIC_VORA_URL
        value: https://www.vora.im
      - key: PUBLIC_COMPANY_URL
        value: https://www.horizonai.ai
      - key: PUBLIC_WORD_MACOS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_WORD_WINDOWS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_WORD_LINUX_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_SLIDE_MACOS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_SLIDE_WINDOWS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_SLIDE_LINUX_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_CELL_MACOS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_CELL_WINDOWS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_CELL_LINUX_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_HWP_MACOS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_HWP_WINDOWS_DOWNLOAD_URL
        value: ""
      - key: PUBLIC_HWP_LINUX_DOWNLOAD_URL
        value: ""
