services:
  - type: web
    name: HorizonAI-Vora-Works
    runtime: static
    repo: https://github.com/saxoji/vora_works_static
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /releases/hwp/1.0.0/VORA-HWP-1.0.0-mac-*
        destination: /downloads/hwp/?os=macos
      - type: redirect
        source: /releases/hwp/1.0.1/VORA-HWP-1.0.1-mac-*
        destination: /downloads/hwp/?os=macos
      - type: redirect
        source: /releases/cell/1.0.0/VORA-CELL-1.0.0-mac-*
        destination: /downloads/cell/?os=macos
      - type: rewrite
        source: /releases/hwp/*
        destination: https://cdn.vora.im/vora-works/releases/hwp/*
      - type: rewrite
        source: /releases/word/*
        destination: https://cdn.vora.im/vora-works/releases/word/*
      - type: rewrite
        source: /releases/cell/*
        destination: https://cdn.vora.im/vora-works/releases/cell/*
      - type: rewrite
        source: /releases/slide/*
        destination: https://cdn.vora.im/vora-works/releases/slide/*
    headers:
      - path: /releases/*/stable.json
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /releases/*/*/manifest.json
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /releases/*/*/VORA-*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DESKTOP_RELEASE_ARTIFACTS
        value: metadata-only
      - key: DESKTOP_RELEASE_ORIGINS_JSON
        value: '{"hwp":"https://cdn.vora.im/vora-works","word":"https://cdn.vora.im/vora-works","cell":"https://cdn.vora.im/vora-works","slide":"https://cdn.vora.im/vora-works"}'
      - key: PUBLIC_SITE_URL
        value: https://works.vora.im
      - key: PUBLIC_WORD_WEB_URL
        value: https://vword.vora.im
      - key: PUBLIC_SLIDE_WEB_URL
        value: https://vslide.vora.im
      - key: PUBLIC_CELL_WEB_URL
        value: https://vcell.vora.im
      - key: PUBLIC_HWP_WEB_URL
        value: https://vhwp.vora.im
      - key: PUBLIC_VORA_URL
        value: https://www.vora.im
      - key: PUBLIC_VORA_SIGNUP_URL
        value: https://www.vora.im/auth/sign-in
      - key: PUBLIC_COMPANY_URL
        value: https://www.horizonai.ai
      - key: PUBLIC_WORD_MACOS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/word/?os=macos
      - key: PUBLIC_WORD_WINDOWS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/word/?os=windows
      - key: PUBLIC_WORD_LINUX_DOWNLOAD_URL
        value: https://works.vora.im/downloads/word/?os=linux
      - key: PUBLIC_SLIDE_MACOS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/slide/?os=macos
      - key: PUBLIC_SLIDE_WINDOWS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/slide/?os=windows
      - key: PUBLIC_SLIDE_LINUX_DOWNLOAD_URL
        value: https://works.vora.im/downloads/slide/?os=linux
      - key: PUBLIC_CELL_MACOS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/cell/?os=macos
      - key: PUBLIC_CELL_WINDOWS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/cell/?os=windows
      - key: PUBLIC_CELL_LINUX_DOWNLOAD_URL
        value: https://works.vora.im/downloads/cell/?os=linux
      - key: PUBLIC_HWP_MACOS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/hwp/?os=macos
      - key: PUBLIC_HWP_WINDOWS_DOWNLOAD_URL
        value: https://works.vora.im/downloads/hwp/?os=windows
      - key: PUBLIC_HWP_LINUX_DOWNLOAD_URL
        value: https://works.vora.im/downloads/hwp/?os=linux
      - key: PUBLIC_HWP_RELEASE_MANIFEST_URL
        value: https://works.vora.im/releases/hwp/stable.json
      - key: DESKTOP_RELEASE_GITHUB_TOKEN
        sync: false
      - key: PUBLIC_WORD_DOWNLOAD_PAGE_URL
        value: https://works.vora.im/downloads/word/
      - key: PUBLIC_WORD_RELEASE_MANIFEST_URL
        value: https://works.vora.im/releases/word/stable.json
      - key: PUBLIC_SLIDE_DOWNLOAD_PAGE_URL
        value: https://works.vora.im/downloads/slide/
      - key: PUBLIC_SLIDE_RELEASE_MANIFEST_URL
        value: https://works.vora.im/releases/slide/stable.json
      - key: PUBLIC_CELL_DOWNLOAD_PAGE_URL
        value: https://works.vora.im/downloads/cell/
      - key: PUBLIC_CELL_RELEASE_MANIFEST_URL
        value: https://works.vora.im/releases/cell/stable.json
      - key: PUBLIC_HWP_DOWNLOAD_PAGE_URL
        value: https://works.vora.im/downloads/hwp/
